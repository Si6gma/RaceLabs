services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tel_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - telemetry-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "20777:20777/udp"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/telemetry
      - UDP_PORT=20777
      - WS_PORT=8000
    depends_on:
      - postgres
    networks:
      - telemetry-net
    volumes:
      - ./backend/app:/app/app

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: tel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - telemetry-net

  nginx:
    image: nginx:alpine
    container_name: tel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - telemetry-net

volumes:
  postgres_data:

networks:
  telemetry-net:
    driver: bridge
